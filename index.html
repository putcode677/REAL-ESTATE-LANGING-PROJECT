<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>real estate landing</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!--header with logo and navigation bar. -->

    <header class="site-header">
  <div class="menu">

    <a href="#logo" class="logo">Anza<span id="span">Homes</span><br>
       </span></span></a>
    
    <nav class="nav-bar" id="nav-bar">
        <ul class="nav-links">
               <li><a href="#">Home</a></li>
               <li><a href="#">Services</a></li>
               <li><a href="#">About</a></li>
               <li><a href="#">Properties</a></li>
               <li><a href="#">Contact</a></li>
        </ul>
    </nav>

  </div>
</header>


<section class="hero" id="top">
  <div class="hero-inner">
    <p class="eyebrow">Dar es Salaam &amp; the coast</p>
    <h1>Find a home that faces the sea.</h1>
    <p class="hero-sub">Curated houses, apartments and villas across Masaki, Mikocheni,
      Oyster Bay and beyond — verified listings, no agent runaround.</p>

    <form class="search-bar" id="searchForm">
      <div class="field">
        <label for="searchLocation">Location</label>
        <input type="text" id="searchLocation" placeholder="e.g. Masaki, Mbezi...">
      </div>
      <div class="field">
        <label for="filterType">Property type</label>
        <select id="filterType">
          <option value="all">All types</option>
          <option value="villa">Villa</option>
          <option value="apartment">Apartment</option>
          <option value="house">House</option>
          <option value="condo">Condo</option>
          <option value="land">Land</option>
        </select>
      </div>
      <div class="field">
        <label for="filterPrice">Price range</label>
        <select id="filterPrice">
          <option value="all">Any price</option>
          <option value="0-150000">Under 150k TZS</option>
          <option value="150000-400000">150k – 400k TZS</option>
          <option value="400000-800000">400k – 800k TZS</option>
          <option value="800000-999999999">800k TZS +</option>
        </select>
      </div>
      <button type="button" class="btn-primary" id="applyFilters">Search</button>
    </form>
  </div>
</section>
</body>
</html>
